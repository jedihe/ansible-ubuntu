---

- name: Install required packages
  apt: name="{{ item }}" state=present update_cache=yes
  with_items:
    - ffmpeg
    - v4l2loopback-dkms

- name: Add OBS-Studio repository
  apt_repository:
    repo: "ppa:obsproject/obs-studio"
    state: present

- name: Install OBS-Studio
  apt: name="{{ item }}" state=present update_cache=yes
  with_items:
    - obs-studio
