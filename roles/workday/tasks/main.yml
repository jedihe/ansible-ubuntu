---

- name: Install required packages
  apt:
    state: latest
    update_cache: yes
    cache_valid_time: "{{ aptcachetime }}"
    pkg:
      - elementary-sdk
      - libgstreamer1.0-dev
      - libclutter-gtk-1.0-dev
      - libclutter-gst-3.0-dev
  become: true

- name: Clone Workday
  git:
    repo: "https://github.com/jedihe/workday.git"
    version: mvp
    dest: "{{ ansible_env.HOME }}/src/workday"
    update: yes
    accept_hostkey: yes

- name: Build
  command: "{{ item }}"
  with_items:
    - "meson build --prefix=/usr"
    - "ninja -C build"
  args:
    chdir: "{{ ansible_env.HOME }}/src/workday"

- name: Install
  command: "{{ item }}"
  with_items:
    - ninja install
  args:
    chdir: "{{ ansible_env.HOME }}/src/workday/build"
  become: true
